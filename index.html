<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CFB Helmet Schedule</title>
  <meta name="description" content="College football seasons as a helmet matrix: every team's week-by-week opponents across the SEC, Big Ten, and ACC." />
  <link rel="stylesheet" href="helmet.css" />
</head>
<body>
  <div id="top-chrome" class="top-chrome">
    <header class="site-header">
      <div class="header-inner">
        <h1 class="brand-title">CFB Helmet Schedule</h1>
        <div class="header-controls">
          <div id="header-actions" class="header-actions">
            <a class="action" href="scoreboard.html" title="Live scoreboard"><span class="action-ico" aria-hidden="true">📊</span>Scoreboard</a>
            <button id="refresh-btn" class="action" type="button" title="Refresh" aria-label="Refresh schedule"><span class="action-ico" aria-hidden="true">🔄</span>Refresh</button>
            <button id="theme-btn" class="action" type="button" title="Toggle light / dark" aria-label="Toggle light or dark mode"><span class="action-ico" aria-hidden="true">🌗</span>Theme</button>
          </div>
          <button id="menu-btn" class="icon-btn menu-btn" type="button" aria-label="Menu" aria-expanded="false" aria-controls="header-actions">☰</button>
        </div>
      </div>
    </header>

    <nav id="conf-tabs" class="conf-tabs" aria-label="Conference"></nav>
  </div>

  <main class="content">
    <div class="legend">
      <span><span class="chip vs">vs</span> home</span>
      <span><span class="chip at">@</span> away</span>
      <span><span class="chip nt">N</span> neutral site</span>
      <span><span class="swatch bye"></span> bye week</span>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">Loading the full SEC schedule…</div>
    <div id="grid-wrap" class="grid-wrap">
      <table id="grid" class="grid" aria-label="SEC helmet schedule"></table>
    </div>
  </main>

  <footer class="site-footer">
    <p>Data &amp; helmet logos via ESPN. The current week is highlighted. Not affiliated with the SEC or ESPN.</p>
  </footer>

  <script src="helmet.js"></script>
</body>
</html>
